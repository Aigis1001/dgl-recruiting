<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会社案内</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="header-logo">
        <img src="assetsimagescheck-rules-01.png" alt="会社ロゴ">
      </a>
      <nav class="header-nav">
        <ul>
          <li><a href="#about">会社を知る</a></li>
          <li><a href="#services">事業内容</a></li>
          <li><a href="#contact">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- 会社を知る セクション -->
    <section id="about" class="section-about">
      <div class="container">
        <!-- 社名表示部分 -->
        <div class="company-brand-logo">
          <img src="assetsimagescheck-rules-01.png" alt="社名ロゴ">
        </div>
        <h2 class="section-title">会社を知る</h2>
        <p class="section-text">
          私たちは最新のテクノロジーとアイディアで、新しい価値を創造し続けます。
        </p>
      </div>
    </section>

    <!-- 事業概要・コンテンツエリア -->
    <section id="services" class="section-services">
      <div class="container">
        <h2 class="section-title">事業内容</h2>
        <div class="service-banner">
          <img src="assetsimagescheck-rules-03.png" alt="ブランドイメージ">
        </div>
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="assetsimagescheck-rules-02.png" alt="シンボルマーク">
      </div>
      <p class="copyright">&copy; 2026 Company Name. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
