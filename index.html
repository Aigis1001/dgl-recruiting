  /* ========================================
     SCROLL REVEAL
     ======================================== */

  .reveal-pop {
    opacity: 0;
    transform: translateY(90px) scale(0.94);
    transition:
      opacity 0.55s ease,
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .reveal-pop.is-visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }


  .reveal-up {
    opacity: 0;
    transform: translateY(45px);
    transition:
      opacity 0.7s ease,
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .reveal-up.is-visible {
    opacity: 1;
    transform: translateY(0);
  }


  .reveal-left {
    opacity: 0;
    transform: translateX(-45px);
    transition:
      opacity 0.7s ease,
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .reveal-left.is-visible {
    opacity: 1;
    transform: translateX(0);
  }


  .reveal-right {
    opacity: 0;
    transform: translateX(45px);
    transition:
      opacity 0.7s ease,
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .reveal-right.is-visible {
    opacity: 1;
    transform: translateX(0);
  }


  /* 少し遅れて表示 */

  .reveal-delay-1 {
    transition-delay: 0.12s;
  }

  .reveal-delay-2 {
    transition-delay: 0.24s;
  }

  .reveal-delay-3 {
    transition-delay: 0.36s;
  }


  /* スマホでは少し控えめ */

  @media (max-width: 639px) {

    .reveal-pop {
      transform: translateY(55px) scale(0.96);
    }

    .reveal-left,
    .reveal-right {
      transform: translateY(30px);
    }

    .reveal-pop.is-visible,
    .reveal-left.is-visible,
    .reveal-right.is-visible {
      transform: translateY(0) scale(1);
    }

  }

.members-v3-circle {
  position: absolute;

  width: 58%;
  aspect-ratio: 1;

  right: -14%;
  top: 12%;

  border-radius: 50%;

  background: rgba(255, 255, 255, 0.48);

  transition:
    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
    background 0.5s ease;
}


/* ========================================
   DOT PATTERN
   ======================================== */

.members-v3-dots {
  position: absolute;

  width: 150px;
  height: 150px;

  left: -25px;
  top: 15%;

  background-image:
    radial-gradient(
      circle,
      rgba(17, 17, 17, 0.8) 0 4px,
      transparent 4.5px
    );

  background-size: 22px 22px;

  transform: rotate(-8deg);

  transition:
    transform 0.8s ease,
    opacity 0.5s ease;
}


/* ========================================
   STAR
   ======================================== */

.members-v3-star {
  position: absolute;

  right: 9%;
  bottom: 20%;

  z-index: 2;

  color: #111111;

  font-size: clamp(42px, 5vw, 70px);
  line-height: 1;

  transform: rotate(12deg);

  transition:
    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
    color 0.5s ease;
}


/* ========================================
   DIAGONAL LINE
   ======================================== */

.members-v3-line {
  position: absolute;

  width: 170%;
  height: 28px;

  left: -35%;
  bottom: 30%;

  background: rgba(255, 255, 255, 0.7);

  transform: rotate(-18deg);

  transition:
    transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
    background 0.5s ease;
}


/* ========================================
   PERSON IMAGE
   ======================================== */

.members-v3-person {
  position: absolute;

  z-index: 2;

  width: 116%;
  height: 94%;

  left: -8%;
  bottom: 0;

  object-fit: contain;
  object-position: center bottom;

  pointer-events: none;

  transition:
    opacity 0.55s ease,
    transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
}

.members-v3-person-normal {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.members-v3-person-hover {
  opacity: 0;
  transform: translateY(18px) scale(0.97);
}


/* ========================================
   NUMBER
   ======================================== */

.members-v3-number {
  position: absolute;

  top: 16px;
  right: 18px;

  z-index: 5;

  color: #ffffff;

  font-family: "Barlow Condensed", sans-serif;
  font-size: clamp(42px, 5vw, 68px);
  line-height: 1;
  font-weight: 900;
  font-style: italic;

  text-shadow:
    2px 2px 0 #111111,
    -1px -1px 0 #111111,
    1px -1px 0 #111111,
    -1px 1px 0 #111111;
}


/* ========================================
   ROLE TAG
   ======================================== */

.members-v3-role {
  position: absolute;

  left: 18px;
  bottom: 18px;

  z-index: 5;

  padding: 10px 14px;

  background: #111111;
  color: #ffffff;

  font-family: "Barlow Condensed", sans-serif;
  font-size: 14px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 0.08em;

  transform: rotate(-2deg);

  transition:
    transform 0.25s ease,
    background 0.4s ease;
}


/* ========================================
   INFO
   ======================================== */

.members-v3-content {
  padding: 26px 24px 28px;
  background: #ffffff;
}

.members-v3-name-row {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}

.members-v3-name-row h3 {
  margin: 0;

  color: #111111;

  font-size: clamp(1.65rem, 2.35vw, 2.1rem);
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -0.03em;
}

.members-v3-name-row span {
  padding: 5px 9px;

  background: #facc15;
  color: #111111;

  font-size: 13px;
  line-height: 1.2;
  font-weight: 900;
}

.members-v3-content > p {
  margin: 16px 0 0;

  color: #52525b;

  font-size: 1rem;
  line-height: 1.75;
  font-weight: 600;
}

.members-v3-read {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-top: 22px;
  padding-top: 14px;

  border-top: 2px solid #111111;

  color: #111111;

  font-family: "Barlow Condensed", sans-serif;
  font-size: 14px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 0.12em;
}

.members-v3-read span {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 34px;
  height: 34px;

  border-radius: 50%;

  background: #111111;
  color: #ffffff;

  font-size: 19px;

  transition:
    transform 0.3s ease;
}


/* ========================================
   HOVER ACTION
   ======================================== */

.members-v3-card:hover .members-v3-scene-normal {
  opacity: 0;
  transform: scale(0.94);
}

.members-v3-card:hover .members-v3-scene-hover {
  opacity: 1;
  transform: scale(1);
}

.members-v3-card:hover .members-v3-person-normal {
  opacity: 0;
  transform: translateY(-12px) scale(1.025);
}

.members-v3-card:hover .members-v3-person-hover {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.members-v3-card:hover .members-v3-circle {
  transform: translate(-12%, 8%) scale(1.12);
}

.members-v3-card:hover .members-v3-dots {
  transform: rotate(8deg) translate(18px, -12px);
}

.members-v3-card:hover .members-v3-star {
  transform: rotate(-18deg) scale(1.2);
}

.members-v3-card:hover .members-v3-line {
  transform: rotate(-25deg) translate(8%, -10px);
}

.members-v3-card:hover .members-v3-role {
  transform: rotate(2deg) translateY(-3px);
}

.members-v3-card:hover .members-v3-read span {
  transform: translateX(6px) rotate(-8deg);
}


/* ========================================
   MOBILE
   ======================================== */

@media (max-width: 767px) {

  .members-v3-inner {
    padding: 58px 18px 70px;
  }

  .members-v3-header {
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 30px;
  }

  .members-v3-title {
    font-size: 3.2rem;
  }

  .members-v3-lead {
    margin-top: 12px;
    font-size: 0.84rem;
  }

  .members-v3-more {
    width: 94px;
    height: 94px;

    padding: 10px;

    border-width: 3px;

    font-size: 11px;

    box-shadow: 5px 5px 0 #111111;
  }

  .members-v3-grid {
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .members-v3-visual {
    aspect-ratio: 4 / 5.2;
  }

  .members-v3-content {
    padding: 21px 18px 23px;
  }

  .members-v3-name-row {
    gap: 10px;
  }

  .members-v3-name-row h3 {
    font-size: 1.55rem;
  }

  .members-v3-name-row span {
    padding: 4px 8px;
    font-size: 12px;
  }

  .members-v3-content > p {
    margin-top: 14px;
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .members-v3-read {
    margin-top: 19px;
    padding-top: 13px;
    font-size: 13px;
  }

  .members-v3-read span {
    width: 32px;
    height: 32px;
    font-size: 18px;
  }

  .members-v3-number {
    font-size: 42px;
  }

  .members-v3-role {
    left: 14px;
    bottom: 14px;
    padding: 8px 11px;
    font-size: 11px;
  }

  .members-v3-person {
    width: 120%;
    height: 94%;
    left: -10%;
  }

}

</style>

<div id="menu-container"></div>

<script src="components/menu.js"></script>

  <style>
    .menu-link {
      display: block;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 18px 20px;
      font-weight: 900;
      transition: all 0.2s ease;
    }

    .menu-link:hover {
      background: #facc15;
      color: #000;
      border-color: #facc15;
    }
  </style>


  <script>
    function toggleMenu() {
      const menu = document.getElementById('menuOverlay');

      if (!menu) {
        return;
      }

      menu.classList.toggle('hidden');
      document.body.classList.toggle('overflow-hidden');
    }

    document.querySelectorAll('.menu-link').forEach(function(link) {
      link.addEventListener('click', function() {
        const menu = document.getElementById('menuOverlay');

        if (menu) {
          menu.classList.add('hidden');
        }

        document.body.classList.remove('overflow-hidden');
      });
    });
  </script>

<script src="components/scroll-effects.js"></script>
